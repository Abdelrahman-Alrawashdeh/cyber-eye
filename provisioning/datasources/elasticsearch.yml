apiVersion: 1

datasources:
  - name: CyberEye-Elasticsearch
    uid: es-cybereye
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    basicAuth: false
    editable: true

    jsonData:
      esVersion: 8
      timeField: "@timestamp"
      timeInterval: "1s"
      maxConcurrentShardRequests: 256
      index: "filebeat-*"
      logMessageField: "alert.signature"
      logLevelField: "event_type"
      tlsSkipVerify: true
