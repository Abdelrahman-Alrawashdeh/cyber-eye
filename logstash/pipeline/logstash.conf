input {
  beats {
    port => 5044
  }
}

filter {

  if [timestamp] and [timestamp] != "" {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  
  if [src_ip] and [src_ip] != "" and [src_ip] != "-" and [src_ip] != "0.0.0.0" {

    
    
    

    geoip {
      source => "src_ip"
      target => "geoip"
      ecs_compatibility => "v8"
    }

    

  } else if [source][ip] and [source][ip] != "" and [source][ip] != "-" and [source][ip] != "0.0.0.0" {

    
    
   

    geoip {
      source => "[source][ip]"
      target => "geoip"
      ecs_compatibility => "v8"
    }

    

  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "filebeat-%{+YYYY.MM.dd}"
    manage_template => false
  }

  stdout { codec => rubydebug }
}
